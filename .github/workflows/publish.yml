name: Publish to npm

# Publishes to npm with a provenance attestation via OIDC Trusted Publishing —
# no NPM_TOKEN secret, nothing to expire. n8n verification (from 2026-05)
# requires publishing from CI with provenance rather than a local machine.
#
# One-time setup on npmjs.com: package n8n-nodes-auditsocials →
# Settings → Trusted Publishers → GitHub Actions →
#   owner: auditsocials · repo: n8n-nodes-auditsocials · workflow: publish.yml

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
